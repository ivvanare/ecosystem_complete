name: ci

# Two gates, both cheap. The test job is the one that matters: the suite needs no services
# (everything is faked), so it runs in about a minute and catches documentation drift through
# internal/contract. The image job only proves the Dockerfile still builds — the runtime
# problems this project actually hit (bind-mount permissions, schema application) need the
# real stack and are not in scope here.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: modules are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum changed after 'go mod tidy': commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # -race is not decoration: it catches the class of bug a plain run misses, like the
      # unsynchronised map in the OIDC verifier cache.
      - name: test
        run: go test -race ./...

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
