# Reverse proxy to the Go service. There is no PHP, no document root and no FastCGI:
# nginx only forwards HTTP to melzone_api.

upstream melzone_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # The security model stores client IPs in audit rows, so they must survive the hop.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location / {
        proxy_pass http://melzone_api;
    }
}
