services:
  # --- API (Go) ---
  api:
    build:
      # Contexto raíz: la imagen copia api/ y database/init.
      context: .
      dockerfile: api/Dockerfile
      # El build descarga módulos de Go, así que necesita DNS. En hosts donde el
      # resolver del bridge no responde (192.168.x.x:53 refused) el build muere en
      # `go mod download`; con host network usa el resolver del host.
      network: host
    container_name: melzone_api
    restart: always
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://admin:my_admin_pass@database:5432/melia?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://admin:admin_pass@rabbitmq:5672/
      DB_INIT_DIR: /app/database/init
      # Origen del panel (Vite en dev). Vacío = sin CORS.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_QUEUE: melia.mail
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: no-reply@melia.test
      LOG_LEVEL: info
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    # El API es el único borde HTTP: sirve directo, sin proxy delante.
    ports:
      - "9000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - melzone_network

  # --- WORKER (consumidor de la cola de correo) ---
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
      network: host
    container_name: melzone_worker
    restart: always
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      RABBITMQ_URL: amqp://admin:admin_pass@rabbitmq:5672/
      MAIL_QUEUE: melia.mail
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: no-reply@melia.test
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - melzone_network

  # --- MAIL CATCHER (dev) ---
  # Atrapa todo el SMTP y lo muestra en http://localhost:8025. Nada sale a internet.
  mailpit:
    image: axllent/mailpit:latest
    container_name: melzone_mailpit
    restart: always
    ports:
      - "8025:8025" # UI + API
      - "1025:1025" # SMTP
    networks:
      - melzone_network

  # --- DATABASE (PostgreSQL 15) ---
  # Levantar solo esta:  docker compose up -d database
  database:
    image: postgres:15-alpine
    container_name: melzone_db
    restart: always
    # Sin esto, PostgreSQL en Docker se queda con 64 MB de /dev/shm y las consultas
    # con paralelismo fallan con "could not resize shared memory segment".
    shm_size: 256mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: my_admin_pass
      # La base se crea acá, no desde un script: el esquema lo aplica el servicio
      # (database/init/02..05) y lo registra en seg.tb_schema_migration.
      POSTGRES_DB: melia
      # Encoding explícito. OJO con la collation: el default (C) ordena los acentos
      # al final ("Ávila" después de "Z"), y eso se nota en un catálogo en español.
      # Si hace falta ordenar bien, es ICU (--locale-provider=icu --icu-locale=es).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado, NO bind mount: con ./database/data el directorio queda
      # root:root (no lo podés limpiar sin sudo) y `down -v` no lo borra, que es
      # justo lo que necesitás cuando iterás sobre los scripts de init.
      - melzone_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Permite que otro servicio dependa con depends_on: condition: service_healthy
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - melzone_network
    # --- BROKER DE MENSAJES ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: melzone_mq
    restart: always
    ports:
      - "5672:5672" # Puerto de comunicación de datos
      - "15672:15672" # Puerto de la interfaz web (Dashboard)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_pass
    networks:
      - melzone_network

  # --- CACHÉ Y LOCKS ---
  redis:
    image: redis:7-alpine
    container_name: melzone_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - melzone_network
  soketi:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    container_name: melzone_soketi
    restart: always
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_METRICS_ENABLED: '1'
    ports:
      - '6001:6001'
      - '9601:9601' # Puerto para métricas
    networks:
      - melzone_network

volumes:
  # Datos de PostgreSQL. Se borra con `docker compose down -v`.
  melzone_pgdata:

networks:
  melzone_network:
    driver: bridge
