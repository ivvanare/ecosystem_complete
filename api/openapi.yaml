openapi: 3.1.0

info:
  title: melia API
  version: 1.0.0
  description: |
    Contract for the security module (identity, sessions, RBAC) plus the health surface.

    This is the single source of truth for the mobile app and the admin panel. Shapes
    follow `database/diagram_base.txt`; field names are the API's, not the column names.

    Conventions
    - Identifiers are UUID strings.
    - Timestamps are RFC 3339 in UTC (`2026-03-15T10:00:00Z`).
    - Lists are paginated: `?page=` (1-based, default 1) and `?limit=` (default 20, max 100).
    - Errors always use the same envelope (see `Error`), never a bare string.
    - Access tokens are stateless JWTs (HS256) sent as `Authorization: Bearer <token>`.
    - Refresh tokens are opaque and rotating: every refresh returns a new one and the
      previous one dies. Presenting a rotated token revokes the whole family.

servers:
  - url: http://localhost:9000
    description: local docker compose

tags:
  - name: Health
    description: Liveness and readiness. No authentication.
  - name: Auth
    description: Registration, login, sessions and credential recovery.
  - name: Identity
    description: The authenticated caller's own profile.
  - name: Discovery
    description: Public, read-only place discovery. No authentication.
  - name: Admin
    description: Backoffice operations. Requires the `admin.access` permission.

security: []

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: Never touches a dependency. A failure here means the process is broken.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Runs every configured dependency probe. `postgres` and `redis` are required;
        `rabbitmq` is optional and only degrades the report.
      responses:
        "200":
          description: All required dependencies answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A required dependency failed (`unavailable`) or an optional one failed (`degraded`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/auth/signup:
    post:
      tags: [Auth]
      operationId: startSignup
      summary: Start registration by proving ownership of the email
      description: |
        Sends a 6-digit code to the email. The account does not exist yet: the pending
        registration lives in `tb_signup_request` until the code is verified, so nobody
        can squat an address they cannot read.

        Always answers `202`, whether or not the email is already registered — the
        response must never reveal account existence. If it is registered, the email
        tells the owner instead of sending a code.

        The email is immutable for the duration of the flow: changing it means starting
        a new signup with a new code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 1, maxLength: 120 }
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: Hashed with Argon2id before it is stored, even before verification.
      responses:
        "202":
          description: Code sent (or deliberately pretended to be sent).
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/signup/verify:
    post:
      tags: [Auth]
      operationId: verifySignup
      summary: Finish registration with the emailed code
      description: |
        Consumes the pending registration and creates the user. The code is single use,
        expires in 10 minutes and allows at most 5 attempts; exhausting them invalidates
        the registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "201":
          description: User created and session started. Browser clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`refresh_token=...; HttpOnly; Secure; SameSite=Lax; Path=/v1/auth` plus a readable `csrf_token`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email and password for a session
      description: |
        Answers `401 invalid_credentials` for both an unknown email and a wrong password,
        and records an HMAC of the attempted email in the audit log — never the address in
        clear, which would be an enumeration oracle.

        Consecutive failures increment `nu_failed_attempts`; past the threshold the account
        is locked and answers `423` until `dt_locked_until` passes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device:
                  type: string
                  maxLength: 120
                  description: Human label shown to the user, e.g. "iPhone de Ana".
      responses:
        "200":
          description: Session started. Browser clients receive the refresh token as a cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`refresh_token=...; HttpOnly; Secure; SameSite=Lax; Path=/v1/auth` plus a readable `csrf_token`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      description: |
        Rotation is mandatory: the presented token is revoked and a new one is issued in
        the same family. Presenting a token that was already rotated is treated as theft —
        the whole family is revoked and the response is `401 refresh_reused`.

        The token comes from the body (mobile) or from the httpOnly `refresh_token`
        cookie (panel). Cookie callers must also send `X-CSRF-Token` matching the readable
        `csrf_token` cookie; body callers do not.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Present for the panel; never readable by JavaScript.
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required when the refresh token arrives as a cookie.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Omit when the cookie carries it.
      responses:
        "200":
          description: New pair issued; the previous refresh token is dead.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Rotated `refresh_token` cookie plus a fresh readable `csrf_token`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: |
        Revokes the refresh family of the presented refresh token.

        Deliberately unauthenticated: the caller proves possession with the refresh token
        itself (body or cookie), and an expired access token must not stop it from ending a
        session. Always answers `204`, even for an unknown token, because the desired state
        is reached either way and an error would confirm whether the token existed.
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required when the refresh token comes from the cookie (double submit).
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: |
            Family revoked. When the refresh token came from the cookie, both cookies are
            expired in the same response. Idempotent.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`refresh_token` and `csrf_token` emptied with `Max-Age=0`. Sent only for the cookie transport.'
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Send a reset code
      description: |
        Public: the caller is not logged in, which is the whole point. Always answers `202`
        regardless of whether the email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Code sent (or deliberately pretended to be sent).
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the emailed code
      description: |
        On success every refresh family of the user is revoked: a password reset must end
        sessions everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        "200":
          description: Password changed; all sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the password of the authenticated user
      description: |
        Requires the current password. On success every refresh family is revoked,
        including the caller's, which must log in again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        "200":
          description: Password changed; all sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/auth/email/change:
    post:
      tags: [Auth]
      operationId: startEmailChange
      summary: Start changing the account email
      description: |
        Sends a code to the NEW address, proving ownership before the change lands. The
        password is required so a stolen access token alone cannot move the account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "202":
          description: Code sent to the new address.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/email/change/verify:
    post:
      tags: [Auth]
      operationId: verifyEmailChange
      summary: Confirm the email change with the emailed code
      description: |
        The code was issued for a specific target address. If the account email changed
        meanwhile, the code is rejected rather than applied to the new state.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Email changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/social:
    post:
      tags: [Auth]
      operationId: loginWithProvider
      summary: Exchange a Google or Apple ID token for a session
      description: |
        The mobile app obtains the ID token with the provider's NATIVE SDK and sends it
        here; there is no redirect and no client secret. The backend validates it against
        the provider's JWKS and issues its own JWT — the provider token is never a
        credential for this API.

        Identity is resolved by `(provider, sub)`, never by email: Apple invents relay
        addresses and may withhold the email entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider: { type: string, enum: [GOOGLE, APPLE] }
                id_token: { type: string }
                device: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Session started, account created on first sight of the identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: The authenticated caller
      description: |
        Returns the profile together with the effective roles and permissions. The panel
        decides what to show from `permissions`; it must not infer capability from a role
        name.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/places:
    get:
      tags: [Discovery]
      operationId: discoverPlaces
      summary: Discover places by radius (list) or viewport (map)
      description: |
        One route, two modes, decided by the locator parameter:

        - **List mode** — `near=lat,long` (latitude first) with optional `radius` in
          metres. Paginated, sortable.
        - **Map mode** — `bbox=minLon,minLat,maxLon,maxLat` (longitude first, like
          GeoJSON) with a required `zoom`. Returns H3 clusters instead of places.

        Exactly one locator is required: sending both or neither is `422
        validation_failed` (`{field: "bbox", code: "invalid"}` when both are present,
        `{field: "locator", code: "required"}` when neither is). Anti-meridian
        crossing is out of scope and rejected.

        The request coordinate is evaluated and discarded: never persisted, never
        logged, never part of a cache key.

        `sort` applies to list mode only. `trending` reads the ranking the worker
        publishes per H3 zone cell; when the zone has no ranking the API falls back
        to `rating` and answers `degraded: true`, so a client can tell a cold
        ranking from an unpopular place. The read path never aggregates reviews in a
        request.

        Map mode caps the viewport query at 5000 rows. An oversized bbox (over
        100 000 km²) is rejected `422` `{field: "bbox", code: "too_long"}` rather
        than silently truncated; if the cap is hit anyway, `truncated: true` and
        cluster counts describe the sample, not the total. A cluster is a zone: it
        carries counts and neutral aggregates and no administrative name.

        `q`, `dish`, `attributes`, `maxPrice` and `openAt` are valid in both modes
        and compose with the locator and with each other. `q` and `dish` are two
        different questions: the first searches the place's commercial name, the
        second searches menu items and returns the places that carry a match —
        both accent-insensitive with no stemming. `attributes` is conjunctive: a
        place must carry every listed code. `maxPrice` is always USD; an item
        priced in another currency never matches, which is documented behaviour.
        `openAt` is answered from the place's schedule in the place's own
        timezone, including schedules that close after midnight. A search with no
        matches is `200` with an empty page, never `404`.
      parameters:
        - name: near
          in: query
          description: '`lat,long`. List mode locator. Closed bounds: latitude −90..90, longitude −180..180.'
          schema: { type: string, example: "10.4806,-66.9036" }
        - name: radius
          in: query
          description: Metres. List mode only.
          schema: { type: integer, minimum: 1, maximum: 50000, default: 2000 }
        - name: bbox
          in: query
          description: '`minLon,minLat,maxLon,maxLat`. Map mode locator. Must be strictly increasing and under the area cap.'
          schema: { type: string, example: "-66.99,10.41,-66.82,10.54" }
        - name: zoom
          in: query
          description: Map mode only, required with `bbox`. Selects the cluster resolution (0–4→3, 5–7→5, 8–10→6, 11–13→7, 14–16→8, 17–21→9).
          schema: { type: integer, minimum: 0, maximum: 21 }
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 filter, both modes.
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - name: region
          in: query
          description: ISO 3166-2 filter, both modes.
          schema: { type: string, pattern: "^[A-Z]{2}-[A-Z0-9]{1,3}$" }
        - name: category
          in: query
          description: Place category UUID filter, both modes.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Commercial-name search, both modes. Accent-insensitive, no stemming. Rejected `422`/`q`/`too_short` under 2 characters, `too_long` over 80.
          schema: { type: string, minLength: 2, maxLength: 80, example: terraza }
        - name: dish
          in: query
          description: Menu-item search returning the places that carry a matching dish, both modes. Same bounds as `q`.
          schema: { type: string, minLength: 2, maxLength: 80, example: arepa }
        - name: attributes
          in: query
          description: Comma-separated attribute codes, conjunctive (a place must carry ALL of them). Unknown codes are rejected `422`/`attributes`/`unknown`.
          schema: { type: string, example: "terraza,petfriendly" }
        - name: maxPrice
          in: query
          description: USD ceiling. Matches places with at least one active USD-priced item on an active menu at or under the amount. Items in other currencies never match. Negative or non-numeric is `422`/`maxPrice`/`invalid`.
          schema: { type: number, minimum: 0, example: 10 }
        - name: openAt
          in: query
          description: ISO-8601 instant. Keeps places open at that instant in the place's own timezone, honouring schedules that close after midnight. Not an instant is `422`/`openAt`/`invalid`.
          schema: { type: string, format: date-time, example: "2026-11-08T03:30:00Z" }
        - name: sort
          in: query
          description: List mode only.
          schema: { type: string, enum: [distance, trending, rating], default: distance }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: List page (list mode) or cluster map (map mode), discriminated by `mode`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaceListPage"
                  - $ref: "#/components/schemas/ClusterMap"
                discriminator:
                  propertyName: mode
                  mapping:
                    list: "#/components/schemas/PlaceListPage"
                    map: "#/components/schemas/ClusterMap"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/places/{coPlace}/reviews:
    get:
      tags: [Reviews]
      operationId: listPlaceReviews
      summary: List the reviews of a place
      description: |
        Public and paginated, newest first. The read never aggregates reviews for
        ordering: the place average belongs to the worker, not to a request.

        Visibility depends on the viewer. Everyone sees reviews that are `ACTIVE` and
        not deleted. The author additionally sees their own rows in any state
        (`INACTIVE`, `MODERATED`, logically deleted), and so does a caller holding
        `review.moderate`. Both are resolved from the bearer token when one is sent;
        the route itself requires no authentication.

        A place that is soft-deleted or `INACTIVE` answers `404`, exactly like a place
        that does not exist, so retired places cannot be enumerated.
      parameters:
        - name: coPlace
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of reviews.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Review a place
      description: |
        Creates the caller's review of the place. One active review per user and
        place is enforced by the partial unique index `ux_tb_review_user_place_active`
        and surfaced as `409 review_already_exists` — never a pre-check, which would
        race. A logically deleted review does not block reviewing again, which is
        exactly why the index is partial.

        The write announces the actor with `set_config('app.current_user_id', ...)` in
        its transaction, so the history trigger records `co_actor_user`. The service
        never inserts into `core.tb_review_history` itself.

        `rating` is an integer in `1..5` (the table CHECK); `comment` is bounded to
        2000 characters at the edge, not in the database.
      security:
        - bearerAuth: []
      parameters:
        - name: coPlace
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUpsert" }
      responses:
        "201":
          description: Review created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The caller already has an active (non-deleted) review for this place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: review_already_exists
                  message: You already have a review for this place.
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/places/{coPlace}/reviews/{coReview}:
    patch:
      tags: [Reviews]
      operationId: updateReview
      summary: Edit your own review
      description: |
        Author-only: anyone else gets `403 permission_denied`. At least one of
        `rating` or `comment` is required. Editing does not change `tx_status` and
        does not resurrect visibility of a `MODERATED` row. A logically deleted
        review is `404`.

        The write announces the actor with `set_config('app.current_user_id', ...)`,
        so the history trigger records `co_actor_user`.
      security:
        - bearerAuth: []
      parameters:
        - name: coPlace
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: coReview
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUpsert" }
      responses:
        "200":
          description: Updated review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Reviews]
      operationId: deleteReview
      summary: Delete your own review
      description: |
        Author-only: anyone else gets `403 permission_denied`. The delete is logical
        (`dt_deleted_at`), never physical: the history trigger records the UPDATE,
        and because the one-review index is partial, the author may review the place
        again afterwards.

        The write announces the actor with `set_config('app.current_user_id', ...)`,
        so the history trigger records `co_actor_user`.
      security:
        - bearerAuth: []
      parameters:
        - name: coPlace
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: coReview
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Review logically deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/reviews/{coReview}:
    patch:
      tags: [Admin, Reviews]
      operationId: moderateReview
      summary: Moderate a review
      description: |
        Requires `review.moderate`. Sets `tx_status` to one of the existing
        `review_status` values (`ACTIVE`, `INACTIVE`, `MODERATED`) — moderation
        invents no new permission and no new enum value. A `MODERATED` review stops
        being returned to readers other than its author and moderators.

        The write announces the actor with `set_config('app.current_user_id', ...)`,
        so the history trigger records `co_actor_user` — the moderation funnel stays
        measurable from `core.tb_review_history`.
      security:
        - bearerAuth: []
      parameters:
        - name: coReview
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ReviewStatus" }
      responses:
        "200":
          description: Moderated review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      description: Requires `admin.access`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          description: Case-insensitive match on name or email.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: scope
          in: query
          description: |
            Narrows by capability, never by a stored type: `admin` is a user whose active
            roles grant `admin.access`, `app` is one without such a role, and `none` is a
            user with no active role at all.
          schema: { type: string, enum: [admin, app, none] }
      responses:
        "200":
          description: Page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/users/invitations:
    post:
      tags: [Admin]
      operationId: inviteUser
      summary: Invite an address to the panel
      description: |
        Requires `admin.access`. Queues an invitation email. Nothing is created and no
        role is granted: the person registers and proves the address with the code, and the
        administrator assigns the role afterwards. The answer is always `202`, so the
        endpoint cannot be used to learn whether an address already has an account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 120 }
      responses:
        "202":
          description: Invitation queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/admin/users/{userId}/password-reset:
    post:
      tags: [Admin]
      operationId: requestUserPasswordReset
      summary: Send the reset code to a user
      description: |
        Requires `admin.access`. Sends the account's reset code to its owner. An administrator
        never sets another account's password: the code proves the address, which keeps
        ownership with the user.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Reset code queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/users/{userId}:
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Edit a user's name or status
      description: |
        Requires `admin.access`. Edits only what an administrator owns: the display name and
        the account status. The email is deliberately absent — it is proven before the row
        exists, so changing it here would skip verification. The change is audited.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 120 }
                status: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/admin/users/{userId}/roles:
    patch:
      tags: [Admin]
      operationId: setUserRoles
      summary: Replace the roles of a user
      description: |
        Requires `admin.access`. Sends the complete desired set, not a delta: the bridge
        table is replaced. A user enters the backoffice because an active role grants
        `admin.access`, never because the record is "of type admin".
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
                  description: Role names, e.g. ["EDITOR"].
      responses:
        "200":
          description: Roles replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/admin/roles:
    get:
      tags: [Admin]
      operationId: listRoles
      summary: List roles
      description: Requires `admin.access`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles with their permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/permissions:
    get:
      tags: [Admin]
      operationId: listPermissions
      summary: List the permission catalogue
      description: Requires `admin.access`. Grouped for the backoffice UI by `module`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAuditEvents
      summary: Read the security audit log
      description: |
        Requires `admin.access`. The log is append-only: this endpoint reads, and no
        endpoint updates or deletes an event. Emails are never returned in clear — failed
        attempts carry an HMAC instead.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: event
          in: query
          description: Exact event name, e.g. `auth.login.failed`.
          schema: { type: string, maxLength: 80 }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: emailHash
          in: query
          description: |
            Exact `email_hash` of the events to return. The log stores only an HMAC-SHA256
            of the address, never the address itself.
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Page of events, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/follows:
    post:
      tags: [Social]
      operationId: followUser
      summary: Follow another account
      description: |
        Asymmetric: following someone says nothing about whether they follow you back.
        Idempotent — following twice leaves the graph unchanged and still answers `204`.
        Following yourself is rejected by the service and by a CHECK constraint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [coUser]
              properties:
                coUser: { type: string, format: uuid }
      responses:
        "204": { description: Following, already or newly. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Social]
      operationId: listFollows
      summary: List the graph in one direction
      description: |
        `mutual` marks a friend: the opposite edge exists too. Computed per request and
        never stored, because the graph changes daily.
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [following, followers], default: following }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [direction, page, limit, total, data]
                properties:
                  direction: { type: string }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GraphMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/follows/{coUser}:
    delete:
      tags: [Social]
      operationId: unfollowUser
      summary: Remove a follow
      description: Idempotent — removing an edge that does not exist answers `204` too.
      security:
        - bearerAuth: []
      parameters:
        - name: coUser
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Not following, anymore or never. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/places/{coPlace}/checkins:
    post:
      tags: [Social]
      operationId: checkIn
      summary: Record presence at a place
      description: |
        The coordinate proves presence and is then discarded: only the verdict `PROXIMITY`
        is stored, never the coordinate and never the distance (D11). A claim outside the
        place radius is refused with `422 not_near_place` rather than silently downgraded,
        and a second check-in on the same day answers `409 already_checked_in` — the
        uniqueness is a database rule, not a service guess.
      security:
        - bearerAuth: []
      parameters:
        - name: coPlace
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [near]
              properties:
                near:
                  type: string
                  description: '`lat,long`. Validated at the edge, used to decide proximity, never stored.'
      responses:
        "201":
          description: Check-in recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already checked in today.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: already_checked_in, message: You already checked in to this place today. }
        "422":
          description: Validation failure, or the coordinate is outside the place radius.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: not_near_place, message: You are not within the radius of this place. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateless HS256 access token, 15 minutes.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: The request is well-formed but the action cannot be completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_code
              message: The code is incorrect or has expired.
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            invalidCredentials:
              value:
                error: { code: invalid_credentials, message: Email or password is incorrect. }
            refreshReused:
              value:
                error: { code: refresh_reused, message: This session was revoked because the token was reused. }
    Forbidden:
      description: Authenticated but the account lacks the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: permission_denied, message: You do not have permission to perform this action. }
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: not_found, message: Not found. }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: email_unavailable, message: That email cannot be used. }
    Locked:
      description: The account is temporarily locked after repeated failures.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: account_locked
              message: Too many failed attempts. Try again later.
              details: { retry_after_seconds: 900 }
    TooManyRequests:
      description: Rate limited. Honor `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later. }
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: validation_failed
              message: The request has invalid fields.
              details:
                fields:
                  - { field: password, code: too_short }

  schemas:
    GraphMember:
      type: object
      additionalProperties: false
      required: [coUser, name, mutual]
      properties:
        coUser: { type: string, format: uuid }
        name: { type: string }
        mutual:
          type: boolean
          description: The opposite edge exists too — the computed friend.
    Checkin:
      type: object
      additionalProperties: false
      required: [coCheckin, coPlace, verification, createdAt]
      properties:
        coCheckin: { type: string, format: uuid }
        coPlace: { type: string, format: uuid }
        verification: { type: string, enum: [SELF_REPORTED, PROXIMITY] }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code. Never parse `message`.
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          description: Human-readable text, safe to show. Never leaks whether an account exists.
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: 'HS256 JWT. Send as `Authorization: Bearer <access_token>`.'
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        refresh_token:
          type: string
          description: |
            Opaque, rotates on every use. Omitted when the client is a browser and the
            token travels in the httpOnly cookie instead.
        refresh_expires_in:
          type: integer
          example: 2592000
        csrf_token:
          type: string
          description: |
            Browser only. Same value as the readable `csrf_token` cookie, repeated in the
            body because that cookie is scoped to `Path=/v1/auth` and a document served
            from the SPA root (or any other host) cannot read it. The client must echo it
            as the `X-CSRF-Token` header on `/v1/auth/refresh` and `/v1/auth/logout`
            (double submit). Absent for non-browser clients: they hold the refresh token
            in the body and pass no CSRF check.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: array
          items:
            type: object
            required: [name, status, required]
            properties:
              name: { type: string, example: postgres }
              status: { type: string, enum: [ok, error] }
              required: { type: boolean }

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    UserSummary:
      type: object
      required: [id, status, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        status: { $ref: "#/components/schemas/UserStatus" }
        email_verified_at: { type: [string, "null"], format: date-time }
        roles:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    Me:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { type: string }
              description: Effective permission codes, e.g. ["admin.access", "place.create"].

    Role:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: ADMIN }
        description: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      required: [id, code, module, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: admin.access }
        module: { type: string, example: USERS }
        name: { type: string, example: Access the backoffice }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    AuditEvent:
      type: object
      required: [id, event, created_at]
      properties:
        id: { type: string, format: uuid }
        event: { type: string, example: auth.login.failed }
        user_id: { type: [string, "null"], format: uuid }
        actor_user_id: { type: [string, "null"], format: uuid }
        email_hash: { type: [string, "null"], description: HMAC-SHA256. Never the address. }
        ip: { type: [string, "null"] }
        country: { type: [string, "null"], description: ISO 3166-1 alpha-2 derived from the IP. }
        city: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Free-form JSON whose shape depends on the event. Declared open on purpose: a bare
            `object` reads as a closed empty record in generators, which is not what the API
            stores.
        created_at: { type: string, format: date-time }

    Page:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    PlaceListPage:
      type: object
      required: [mode, page, limit, total, sortApplied, degraded, data]
      properties:
        mode: { type: string, const: list }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        sortApplied:
          type: string
          enum: [distance, trending, rating]
          description: The order that actually ran, which may differ from the requested `sort`.
        degraded:
          type: boolean
          description: '`true` when a requested `trending` had no zone ranking and fell back to `rating`. A cold ranking is not an error.'
        data:
          type: array
          items: { $ref: "#/components/schemas/PlaceSummary" }

    PlaceSummary:
      type: object
      required: [coPlace, name, category, country, region, latitude, longitude, address, distanceMeters, rating]
      properties:
        coPlace: { type: string, format: uuid }
        name:
          type: string
          description: The commercial name (`tb_place.tx_title`). The legal name (`tx_name`) and the owner are never exposed in the discovery read path.
        category: { $ref: "#/components/schemas/PlaceCategory" }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        region: { type: [string, "null"], pattern: "^[A-Z]{2}-[A-Z0-9]{1,3}$" }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        address: { type: [string, "null"] }
        distanceMeters:
          type: integer
          description: Whole metres from `near`. Present in list mode; never fabricated.
        rating:
          anyOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
          description: '`null` when the worker has published no aggregate for the place. Absence is not an error.'
        trendingRank:
          type: integer
          minimum: 1
          description: Present only when `sort=trending` and a zone ranking ordered the row.

    PlaceCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Arepera }

    Rating:
      type: object
      required: [average, count]
      properties:
        average: { type: number, format: double, example: 4.6 }
        count: { type: integer, minimum: 0, example: 128 }

    ClusterMap:
      type: object
      required: [mode, zoom, resolution, total, truncated, clusters]
      properties:
        mode: { type: string, const: map }
        zoom: { type: integer, minimum: 0, maximum: 21 }
        resolution:
          type: integer
          minimum: 0
          maximum: 15
          description: The H3 resolution the clusters are grouped at, derived from `zoom`.
        total:
          type: integer
          minimum: 0
          description: Places behind the clusters, not the number of clusters.
        truncated:
          type: boolean
          description: '`true` when the 5000-row cap was hit: cluster counts describe the sample, never present them as totals.'
        clusters:
          type: array
          items: { $ref: "#/components/schemas/Cluster" }

    Cluster:
      type: object
      required: [cell, resolution, count, center, averageRating]
      properties:
        cell:
          type: string
          example: "872830828ffffff"
          description: H3 index serialized as a hex string — JSON numbers lose precision above 2^53, and the index uses the full 64-bit range.
        resolution: { type: integer, minimum: 0, maximum: 15 }
        count: { type: integer, minimum: 1 }
        center: { $ref: "#/components/schemas/GeoPoint" }
        averageRating:
          type: [number, "null"]
          format: double
          description: Mean of the published place ratings in the cell. `null` when unknown, never `0`. A cluster is a zone — it carries no name, district or administrative claim.

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    ReviewStatus:
      type: string
      enum: [ACTIVE, INACTIVE, MODERATED]
      description: Mirrors `public.review_status`. Moderation reuses it; no new enum value is invented.

    ReviewUpsert:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Required on create; optional on edit. Bounded by the table CHECK.
        comment:
          type: string
          maxLength: 2000
          description: Bounded at the edge, not in the database.

    Review:
      type: object
      additionalProperties: false
      required: [coReview, coPlace, rating, comment, status, author, createdAt, updatedAt, viaFollowedAuthor]
      properties:
        coReview: { type: string, format: uuid }
        viaFollowedAuthor:
          type: boolean
          description: |
            Viewer-relative highlight: true when the reader follows this review's author.
            A property of the read, never of the row — the same review is highlighted for
            one viewer and plain for another. False for anonymous readers, and never cached
            under a key that lacks the viewer.
        coPlace: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 2000 }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        author:
          type: object
          required: [id, name]
          description: Display-safe author fields. The email is never exposed.
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"], description: "`seg.tb_user.tx_name`; `null` when the account never gave one (social sign-in)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Review" }
