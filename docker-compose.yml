services:
  # --- API (Go) ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: melzone_api
    restart: always
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://admin:my_admin_pass@database:5432/melzone?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://admin:admin_pass@rabbitmq:5672/
      DB_INIT_DIR: /app/database/init
      LOG_LEVEL: info
    volumes:
      # Canonical schema files: the service applies pending ones at startup.
      - ./database/init:/app/database/init:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - melzone_network

  # --- WEBSERVER (NGINX) ---
  webserver:
    image: nginx:alpine
    container_name: melzone_nginx
    restart: always
    ports:
      - "9000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - api
    networks:
      - melzone_network

  # --- DATABASE (PostgreSQL 15) ---
  # Levantar solo esta:  docker compose up -d database
  database:
    image: postgres:15-alpine
    container_name: melzone_db
    restart: always
    # Sin esto, PostgreSQL en Docker se queda con 64 MB de /dev/shm y las consultas
    # con paralelismo fallan con "could not resize shared memory segment".
    shm_size: 256mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: my_admin_pass
      # La base se crea acá, no desde un script: el esquema lo aplica el servicio
      # (database/init/02..05) y lo registra en seg.tb_schema_migration.
      POSTGRES_DB: melzone
      # Encoding explícito. OJO con la collation: el default (C) ordena los acentos
      # al final ("Ávila" después de "Z"), y eso se nota en un catálogo en español.
      # Si hace falta ordenar bien, es ICU (--locale-provider=icu --icu-locale=es).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # Volumen nombrado, NO bind mount: con ./database/data el directorio queda
      # root:root (no lo podés limpiar sin sudo) y `down -v` no lo borra, que es
      # justo lo que necesitás cuando iterás sobre los scripts de init.
      - melzone_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Permite que otro servicio dependa con depends_on: condition: service_healthy
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - melzone_network
    # --- BROKER DE MENSAJES ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: melzone_mq
    restart: always
    ports:
      - "5672:5672" # Puerto de comunicación de datos
      - "15672:15672" # Puerto de la interfaz web (Dashboard)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_pass
    networks:
      - melzone_network

  # --- CACHÉ Y LOCKS ---
  redis:
    image: redis:7-alpine
    container_name: melzone_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - melzone_network
  soketi:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    container_name: melzone_soketi
    restart: always
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_METRICS_ENABLED: '1'
    ports:
      - '6001:6001'
      - '9601:9601' # Puerto para métricas
    networks:
      - melzone_network

volumes:
  # Datos de PostgreSQL. Se borra con `docker compose down -v`.
  melzone_pgdata:

networks:
  melzone_network:
    driver: bridge
