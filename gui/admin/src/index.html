<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Keep the key in sync with THEME_STORAGE_KEY in core/theme.service.ts. This
       runs before the bundle so the first paint never flashes the light theme. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('melia.theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* storage blocked: default styling applies */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
